<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D MODELER · 20-20-TOOLBOX</title>
<link rel="icon" type="image/png" href="../icon.png">
<link rel="stylesheet" href="modeler.css?v=326">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<header>
  <div class="logo">20-20-TOOLBOX</div><div class="version">V3.26 · 3D MODELER BETA</div>
  <div class="head-actions"><a href="../index.html">← TOOLBOX</a><button id="btnNew">NOVÝ MODEL</button><button id="btnOpen">OTEVŘÍT</button><input id="fileOpen" type="file" accept=".stl,.obj,.glb,.gltf" hidden><button id="btnDownload" class="dark">STÁHNOUT STL</button><button id="btnPrint" class="accent">POSLAT DO 3D TISKU</button></div>
</header>
<div class="app">
  <aside class="leftbar">
    <div class="panel-title">KRESLIT</div>
    <button data-tool="select" class="active"><span>↖</span>Výběr <kbd>Esc</kbd></button>
    <button data-tool="line"><span>／</span>Čára / polygon <kbd>L</kbd></button>
    <button data-tool="rect"><span>□</span>Obdélník <kbd>B</kbd></button>
    <button data-tool="circle"><span>○</span>Kruh <kbd>C</kbd></button>
    <button data-tool="measure"><span>↔</span>Měření <kbd>M</kbd></button>
    <div class="sep"></div>
    <div class="panel-title">MODELOVAT</div>
    <button data-tool="pushpull"><span>⇧</span>Push / Pull <kbd>P</kbd></button>
    <button id="btnFaceFromSelection"><span>▱</span>Uzavřít plochu</button>
    <div class="sep"></div>
    <div class="panel-title">VYTVOŘIT TĚLESO</div>
    <button data-add="box"><span>▣</span>Kvádr</button>
    <button data-add="cylinder"><span>○</span>Válec</button>
    <button data-add="sphere"><span>●</span>Koule</button>
    <button data-add="plane"><span>▱</span>Deska</button>
    <div class="sep"></div>
    <div class="panel-title">UPRAVIT</div>
    <button data-mode="translate">Přesun <kbd>W</kbd></button>
    <button data-mode="rotate">Rotace <kbd>E</kbd></button>
    <button data-mode="scale">Měřítko <kbd>R</kbd></button>
    <button id="btnDuplicate">Duplikovat <kbd>Ctrl+D</kbd></button>
    <button id="btnDelete">Smazat <kbd>Del</kbd></button>
    <div class="sep"></div>
    <button id="btnUndo">↶ Zpět</button><button id="btnRedo">↷ Znovu</button>
  </aside>
  <main id="viewport">
    <div id="hint">L čára · B obdélník · C kruh · P Push/Pull · M měření · Esc ukončí nástroj</div>
    <div id="toolBadge">VÝBĚR</div>
    <div id="measureOverlay"></div>
  </main>
  <aside class="rightbar">
    <div class="panel-title">OBJEKT</div>
    <div id="noSelection" class="muted">Není vybrán žádný objekt.</div>
    <div id="objectPanel" hidden>
      <label>Název<input id="objName" type="text"></label>
      <div class="group"><b>ROZMĚRY [mm]</b><div class="triple"><label>X<input id="dimX" type="number" step="1"></label><label>Y<input id="dimY" type="number" step="1"></label><label>Z<input id="dimZ" type="number" step="1"></label></div></div>
      <div class="group"><b>POZICE [mm]</b><div class="triple"><label>X<input id="posX" type="number" step="1"></label><label>Y<input id="posY" type="number" step="1"></label><label>Z<input id="posZ" type="number" step="1"></label></div></div>
      <div class="group"><b>ROTACE [°]</b><div class="triple"><label>X<input id="rotX" type="number" step="1"></label><label>Y<input id="rotY" type="number" step="1"></label><label>Z<input id="rotZ" type="number" step="1"></label></div></div>
      <label>Barva<input id="objColor" type="color" value="#c7c7c7"></label>
      <div id="faceTools" class="group" hidden><b>PLOCHA</b><label>Výška vytažení [mm]<input id="pushHeight" type="number" value="1000" step="10"></label><button id="btnPushExact" class="wide">Vytáhnout přesně</button></div>
    </div>
    <div class="sep"></div>
    <div class="panel-title">KRESLENÍ</div>
    <label class="check"><input id="snapToggle" type="checkbox" checked> Snap na mřížku</label>
    <label>Rozteč snapu [mm]<input id="snapSize" type="number" value="10" min="1" step="1"></label>
    <label class="check"><input id="endpointSnap" type="checkbox" checked> Snap na koncové body</label>
    <div class="sep"></div>
    <div class="panel-title">SCÉNA</div>
    <button class="view" data-view="iso">Perspektiva</button><button class="view" data-view="top">Shora</button><button class="view" data-view="front">Zepředu</button><button class="view" data-view="right">Zprava</button>
    <label class="check"><input id="gridToggle" type="checkbox" checked> Mřížka</label>
    <label class="check"><input id="edgesToggle" type="checkbox" checked> Hrany objektů</label>
    <div class="stats" id="stats">0 objektů</div>
  </aside>
</div>
<div id="statusbar"><span id="statusText">Připraveno</span><b id="statusValue">—</b></div>
<div id="toast"></div>
<script type="module" src="modeler.js?v=326"></script>
</body>
</html>
