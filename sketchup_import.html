<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SketchUp → 20-20-TOOLBOX</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f4f5;font:13px system-ui,Segoe UI,sans-serif;color:#18181b}#app{position:absolute;inset:0;width:100%;height:100%;border:0}.status{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:99999;background:#18181b;color:#fff;border-radius:8px;padding:9px 13px;box-shadow:0 5px 18px #0003;max-width:min(620px,90vw)}.status.err{background:#991b1b}
</style>
</head>
<body>
<div id="status" class="status">Načítám model ze SketchUpu…</div>
<iframe id="app" src="index.html"></iframe>
<script>
(()=>{
 const token=new URLSearchParams(location.search).get('token');
 const status=document.getElementById('status'),frame=document.getElementById('app');
 const say=(t,err=false)=>{status.textContent=t;status.classList.toggle('err',err)};
 const findInput=doc=>{
   const inputs=[...doc.querySelectorAll('#tool-3dprint input[type=file], input[type=file]')];
   return inputs.find(x=>/stl|obj|3mf|model/i.test((x.accept||'')+' '+(x.id||'')+' '+(x.name||'')))||inputs[0];
 };
 async function run(){
   if(!token) throw new Error('Chybí token modelu.');
   say('Stahuju STL z lokálního PrusaBridge…');
   const r=await fetch('http://127.0.0.1:8091/sketchup-file?token='+encodeURIComponent(token),{cache:'no-store'});
   if(!r.ok) throw new Error('PrusaBridge model nevydal (HTTP '+r.status+').');
   const blob=await r.blob();
   if(!blob.size) throw new Error('Přenesený STL je prázdný.');
   await new Promise((resolve,reject)=>{if(frame.contentDocument?.readyState==='complete')resolve();else{frame.addEventListener('load',resolve,{once:true});setTimeout(()=>reject(new Error('Toolbox se nenačetl včas.')),15000)}});
   const win=frame.contentWindow,doc=frame.contentDocument;
   win.openTool?.('3dprint');
   await new Promise(r=>setTimeout(r,150));
   const input=findInput(doc); if(!input) throw new Error('V aplikaci 3D tisk nebyl nalezen vstup pro model.');
   const name=decodeURIComponent(r.headers.get('X-File-Name')||'sketchup-model.stl');
   const file=new File([blob],name,{type:'model/stl'}),dt=new DataTransfer();dt.items.add(file);input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));
   say('Model ze SketchUpu byl automaticky načten do 3D tisku.');
   setTimeout(()=>status.remove(),2500);
 }
 run().catch(e=>{console.error(e);say('Přenos ze SketchUpu selhal: '+(e.message||e),true)});
})();
</script>
</body>
</html>
