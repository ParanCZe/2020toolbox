name: Publish RM Tools v1.1.3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rm-tools-v113.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified RM Tools package
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > SketchUpPlugins/20-20_RM_Tools_v1.1.3.rbz
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, re
          dst=Path("SketchUpPlugins/20-20_RM_Tools_v1.1.3.rbz")
          with zipfile.ZipFile(dst) as z:
              bad=z.testzip()
              if bad: raise SystemExit("bad zip member: "+bad)
          p=Path("index.html")
          html=p.read_text(encoding="utf-8")
          start=html.find("id:'rm-checker'")
          bs=html.rfind("{",0,start)
          depth=0; quote=None; esc=False; be=None
          for i in range(bs,len(html)):
              c=html[i]
              if quote:
                  if esc: esc=False
                  elif c=="\\": esc=True
                  elif c==quote: quote=None
                  continue
              if c in ("'",'"',chr(96)):
                  quote=c; continue
              if c=="{": depth+=1
              elif c=="}":
                  depth-=1
                  if depth==0: be=i+1; break
          b=html[bs:be]
          b=re.sub(r"current:'[^']*'","current:'1.1.3'",b,count=1)
          b=re.sub(r"meta:'[^']*'","meta:'V1.1.3 opravuje instalaci RM Tools přes Toolbox. Balíček je nově ověřený ZIP/RBZ bez problematické komprese; funkce v1.1.2 zůstávají zachované.'",b,count=1)
          if '"version":"1.1.3"' not in b:
              pos=b.rfind("]")
              pre=b[:pos].rstrip()
              if not pre.endswith(","): pre+=","
              entry='\n    {"version":"1.1.3","file":"20-20_RM_Tools_v1.1.3.rbz","size":'+str(dst.stat().st_size)+',"repo_file":"SketchUpPlugins/20-20_RM_Tools_v1.1.3.rbz"}\n  '
              b=pre+entry+b[pos:]
          p.write_text(html[:bs]+b+html[be:],encoding="utf-8")
          PY
      - name: Commit verified package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SketchUpPlugins/20-20_RM_Tools_v1.1.3.rbz index.html
          git diff --cached --quiet && exit 0
          git commit -m "Publish verified 20-20 RM Tools v1.1.3"
          git push
