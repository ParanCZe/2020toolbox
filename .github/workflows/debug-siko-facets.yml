name: Debug SIKO Facets

on:
  push:
    paths:
      - '.github/workflows/debug-siko-facets.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Inspect category facet markup
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          url='https://www.siko.cz/dlazby/c/C002?__bot=1&currentPage=0'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 Chrome/153','Accept-Language':'cs-CZ,cs;q=0.9'},timeout=30)
          print('STATUS',r.status_code,'LEN',len(r.text))
          text=r.text
          for pat in ['Rozměr (cm)','Značka','Série','facets','facet','brand','manufacturer','series','dimension','filter']:
            print('\n###',pat)
            for m in list(re.finditer(re.escape(pat),text,re.I))[:8]:
              print(text[max(0,m.start()-500):m.start()+1800].replace('\n',' ')[:2400])
          soup=BeautifulSoup(text,'html.parser')
          print('\n### FORMS')
          for form in soup.find_all('form')[:20]:
            s=str(form)
            if 'facet' in s.lower() or 'filter' in s.lower() or 'Značka' in s or 'Rozměr' in s:
              print(s[:12000])
          print('\n### JSON SCRIPTS')
          for i,scr in enumerate(soup.find_all('script')):
            raw=scr.string or ''
            if any(k.lower() in raw.lower() for k in ['facet','rozměr','značka','série']):
              print('SCRIPT',i,raw[:30000])
          PY
