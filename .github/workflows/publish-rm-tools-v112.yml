name: Publish RM Tools v1.1.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rm-tools-v112.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RM Tools v1.1.2 and update Toolbox
        shell: python
        run: |
          from pathlib import Path
          import zipfile, tempfile, shutil, re, os

          src = Path('SketchUpPlugins/20-20_RM_Tools_v1.1.1.rbz')
          dst = Path('SketchUpPlugins/20-20_RM_Tools_v1.1.2.rbz')
          tmp = Path(tempfile.mkdtemp())
          with zipfile.ZipFile(src) as z:
              z.extractall(tmp)

          loader = tmp / 'twentytwenty_rm_checker.rb'
          main = tmp / 'twentytwenty_rm_checker' / 'main.rb'

          s = loader.read_text(encoding='utf-8').replace("EXTENSION_VERSION = '1.1.1'", "EXTENSION_VERSION = '1.1.2'")
          loader.write_text(s, encoding='utf-8', newline='\n')

          s = main.read_text(encoding='utf-8').replace("VERSION = '1.1.1'", "VERSION = '1.1.2'")
          old = """      @toolbar ||= UI::Toolbar.new('20-20 RM Tools')
      @toolbar.add_item(@command) if @toolbar.count == 0
      @toolbar.restore
"""
          new = """      @toolbar ||= UI::Toolbar.new('20-20 RM Tools')
      unless @toolbar_item_added
        @toolbar.add_item(@command)
        @toolbar_item_added = true
      end
      begin
        @toolbar.restore
      rescue StandardError
        @toolbar.show
      end
"""
          if old not in s:
              raise SystemExit('toolbar block not found')
          s = s.replace(old, new)
          main.write_text(s, encoding='utf-8', newline='\n')

          with zipfile.ZipFile(dst, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in tmp.rglob('*'):
                  if p.is_file():
                      z.write(p, p.relative_to(tmp).as_posix())
          shutil.rmtree(tmp)

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          start = html.find("id:'rm-checker'")
          if start < 0:
              raise SystemExit('rm-checker block not found')
          block_start = html.rfind('{', 0, start)
          depth = 0
          quote = None
          esc = False
          block_end = None
          for i in range(block_start, len(html)):
              c = html[i]
              if quote:
                  if esc: esc = False
                  elif c == '\\': esc = True
                  elif c == quote: quote = None
                  continue
              if c in "'\"\`":
                  quote = c
                  continue
              if c == '{': depth += 1
              elif c == '}':
                  depth -= 1
                  if depth == 0:
                      block_end = i + 1
                      break
          b = html[block_start:block_end]
          b = re.sub(r"current:'[^']*'", "current:'1.1.2'", b, count=1)
          b = re.sub(r"meta:'[^']*'", "meta:'V1.1.2 opravuje zobrazení toolbaru ve SketchUpu 2026: nepoužívá nepodporované Toolbar#count, položku přidává jednou a restore má fallback na show. Zachovává navigaci k nálezům, ohniska, řazení INFO / VAROVÁNÍ / CHYBY a AI context.'", b, count=1)
          if '"version":"1.1.2"' not in b:
              pos = b.rfind(']')
              pre = b[:pos].rstrip()
              if not pre.endswith(','):
                  pre += ','
              size = dst.stat().st_size
              entry = f'\n    {{"version":"1.1.2","file":"20-20_RM_Tools_v1.1.2.rbz","size":{size},"repo_file":"SketchUpPlugins/20-20_RM_Tools_v1.1.2.rbz"}}\n  '
              b = pre + entry + b[pos:]
          p.write_text(html[:block_start] + b + html[block_end:], encoding='utf-8')
      - name: Commit generated plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SketchUpPlugins/20-20_RM_Tools_v1.1.2.rbz index.html
          git diff --cached --quiet && exit 0
          git commit -m "Publish 20-20 RM Tools v1.1.2"
          git push
