name: Debug EGGER Page

on:
  push:
    paths:
      - '.github/workflows/debug-egger-page.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Inspect sample decor page
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          url='https://www.egger.com/cs/vyroba-nabytku-a-interierovy-design/dekory/H1384_40?country=CZ'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Accept-Language':'cs-CZ,cs;q=0.9'})
          r=s.get(url,timeout=30)
          print('STATUS',r.status_code,'LEN',len(r.text))
          print('FINAL',r.url)
          soup=BeautifulSoup(r.text,'html.parser')
          print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
          h=soup.find('h1');print('H1',h.get_text(' ',strip=True) if h else '')
          for m in soup.find_all('meta'):
            k=m.get('property') or m.get('name') or ''
            v=m.get('content') or ''
            if 'image' in k.lower() or 'title' in k.lower():
              print('META',k,v[:500])
          for i,img in enumerate(soup.find_all('img')[:120]):
            src=img.get('src') or img.get('data-src') or img.get('data-original') or ''
            alt=img.get('alt') or ''
            if src or alt:
              print('IMG',i,'ALT=',alt[:120],'SRC=',src[:500])
          text=r.text
          for pat in ['H1384','decorImage','decor-image','imageData','cdn.egger.com','productImage','zoom']:
            print('PAT',pat,[text[max(0,m.start()-250):m.start()+800].replace('\n',' ') for m in list(re.finditer(pat,text,re.I))[:6]])
          PY
