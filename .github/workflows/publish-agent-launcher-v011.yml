name: Publish Agent Launcher v0.1.2

on:
  push:
    paths:
      - '.github/workflows/publish-agent-launcher-v011.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Toolbox plugin catalog
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path("index.html")
          text=path.read_text(encoding="utf-8")
          needle="const SU_PLUGIN_CATALOG = ["
          pos=text.find(needle)
          if pos<0:
              raise SystemExit("SU_PLUGIN_CATALOG not found")

          arr_start=text.find("[",pos)
          depth=0
          quote=None
          escape=False
          arr_end=None
          for i in range(arr_start,len(text)):
              ch=text[i]
              if quote:
                  if escape:
                      escape=False
                  elif ch=="\\":
                      escape=True
                  elif ch==quote:
                      quote=None
                  continue
              if ch in ("'", '"', "`"):
                  quote=ch
                  continue
              if ch=="[":
                  depth+=1
              elif ch=="]":
                  depth-=1
                  if depth==0:
                      arr_end=i
                      break
          if arr_end is None:
              raise SystemExit("catalog closing bracket not found")

          obj="""  {
            id:'agent-launcher',
            loader:'twentytwenty_agent_launcher.rb',
            name:'20-20 Agent Launcher',
            current:'0.1.2',
            description:'Jedním kliknutím spustí uživatelem zvolený adapter-agent.exe a načte uživatelem zvolený most.rb do SketchUp Ruby prostředí.',
            meta:'V0.1.2: Ruby Console se už vůbec neotevírá. Kliknutí na Spustit 20-20 Agent spustí adapter-agent.exe a potichu provede load z uložené cesty k most.rb přímo ve stejném SketchUp Ruby runtime. Cesty zůstávají uživatelské a měnitelné samostatnými tlačítky v Extensions.',
            icon:'export',
            versions:[{"version":"0.1.0","file":"20-20_Agent_Launcher_v0.1.0.rbz","size":3854,"repo_file":"SketchUpPlugins/20-20_Agent_Launcher_v0.1.0.rbz"},{"version":"0.1.1","file":"20-20_Agent_Launcher_v0.1.1.rbz","size":3945,"repo_file":"SketchUpPlugins/20-20_Agent_Launcher_v0.1.1.rbz"},{"version":"0.1.2","file":"20-20_Agent_Launcher_v0.1.2.rbz","size":3663,"repo_file":"SketchUpPlugins/20-20_Agent_Launcher_v0.1.2.rbz"}]
          }"""

          obj_pos=text.find("id:'agent-launcher'",arr_start,arr_end)
          if obj_pos>=0:
              start=text.rfind("\n  {",arr_start,obj_pos)
              start=start+1 if start>=0 else text.rfind("{",arr_start,obj_pos)
              depth=0;quote=None;escape=False;end=None
              for i in range(start,arr_end):
                  ch=text[i]
                  if quote:
                      if escape: escape=False
                      elif ch=="\\": escape=True
                      elif ch==quote: quote=None
                      continue
                  if ch in ("'", '"', "`"): quote=ch; continue
                  if ch=="{": depth+=1
                  elif ch=="}":
                      depth-=1
                      if depth==0:
                          end=i+1
                          break
              if end is None:
                  raise SystemExit("existing agent-launcher object end not found")
              text=text[:start]+obj+text[end:]
          else:
              prefix=text[:arr_end].rstrip()
              comma="" if prefix.endswith("[") else ","
              text=prefix+comma+"\n"+obj+"\n"+text[arr_end:]

          path.write_text(text,encoding="utf-8")
          PY
      - name: Commit Toolbox catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Catalog already current"
            exit 0
          fi
          git commit -m "Publish Agent Launcher v0.1.2"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push
