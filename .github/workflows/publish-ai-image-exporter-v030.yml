name: Publish AI Image Exporter v0.3.0

on:
  push:
    paths:
      - '.github/workflows/publish-ai-image-exporter-v030.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Toolbox plugin catalog
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          needle = "id:'ai-exporter'"
          pos = text.find(needle)
          if pos < 0:
              raise SystemExit("AI exporter catalog object not found")

          start = text.rfind("\n  {", 0, pos)
          if start < 0:
              raise SystemExit("AI exporter object start not found")
          start += 1

          # Match the JS object closing brace while ignoring quoted strings.
          depth = 0
          quote = None
          escape = False
          end = None
          for i in range(start, len(text)):
              ch = text[i]
              if quote:
                  if escape:
                      escape = False
                  elif ch == "\\":
                      escape = True
                  elif ch == quote:
                      quote = None
                  continue
              if ch in ("'", '"', "`"):
                  quote = ch
                  continue
              if ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit("AI exporter object end not found")

          new = """  {
              id:'ai-exporter',
              name:'20-20 AI Image Exporter',
              current:'0.3.0',
              description:'16:9 exporter pro SketchUp. Standard 4K/6K/8K nebo AI export RGB + Z-depth + Lines.',
              meta:'V0.3.0 přidává druhý blok AI Export: 4K, 6K a 8K. Každý AI export vytvoří RGB PNG, Z-depth PNG, čárový PNG a CAMERA.json. Z-depth používá čistý monochrome+fog pass podle vzdálenosti od aktuální kamery; původní styl se po exportu obnoví.',
              icon:'export',
              versions:[{"version":"0.1.0","file":"20-20_Nano_Banana_Exporter_v0.1.0.rbz","size":5577},{"version":"0.1.1","file":"20-20_Nano_Banana_Exporter_v0.1.1.rbz","size":5678},{"version":"0.1.2","file":"20-20_Nano_Banana_Exporter_v0.1.2.rbz","size":5699},{"version":"0.1.3","file":"20-20_Nano_Banana_Exporter_v0.1.3.rbz","size":9135},{"version":"0.1.4","file":"20-20_Nano_Banana_Exporter_v0.1.4.rbz","size":9301},{"version":"0.1.5","file":"20-20_Nano_Banana_Exporter_v0.1.5.rbz","size":9771},{"version":"0.2.0","file":"20-20_AI_Image_Exporter_v0.2.0.rbz","size":4184},{"version":"0.3.0","file":"20-20_AI_Image_Exporter_v0.3.0.rbz","size":7642,"repo_file":"SketchUpPlugins/20-20_AI_Image_Exporter_v0.3.0.rbz"}]
            }"""
          text = text[:start] + new + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit Toolbox catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Catalog already current"
            exit 0
          fi
          git commit -m "Publish AI Image Exporter v0.3.0"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push
