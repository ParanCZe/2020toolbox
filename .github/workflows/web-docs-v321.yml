name: Web V3.21 Documentation tools

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/web-docs-v321.yml
      - tools/patch_docs_v321.py
      - docs_upgrade_v321.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch documentation tools and version
        run: |
          python tools/patch_docs_v321.py
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          u=Path('norms_ui_v315b.js').read_text(encoding='utf-8')
          assert 'id="app-version">V3.21<' in s
          assert "version.textContent = 'V3.21 · SAFARI'" in s
          assert 'docs_upgrade_v321.js?v=321' in s
          assert "const VERSION='V3.21';" in u
          print('V3.21 checks OK')
          PY
      - name: Commit V3.21
        run: |
          git config user.name '20-20 Web Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html norms_ui_v315b.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V3.21 fix header version and improve documentation tools'
          git push origin main
