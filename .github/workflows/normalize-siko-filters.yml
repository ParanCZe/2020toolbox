name: Normalize SIKO Filters

on:
  push:
    paths:
      - '.github/workflows/normalize-siko-filters.yml'
      - 'SketchUpPlugins/TextureLibrarySource/tools/normalize_siko_filters.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize filters
        run: python SketchUpPlugins/TextureLibrarySource/tools/normalize_siko_filters.py
      - name: Commit normalized catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SketchUpPlugins/TextureLibrarySource/twentytwenty_texture_library/siko_concrete_tiles.json
          git add SketchUpPlugins/TextureLibrarySource/twentytwenty_texture_library/siko_floor_tiles.json
          if git diff --cached --quiet; then
            echo "No filter changes"
          else
            git commit -m "Normalize SIKO catalog filters"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main
            done
            git push
          fi
