name: Authorization TEST profiles

on:
  push:
    branches:
      - fix/test-cert-local-tsa-pades
    paths:
      - authorization_pdf_v326.js
      - AuthorizationBridge/**
      - .github/workflows/authorization-test-profiles.yml
  pull_request:
    paths:
      - authorization_pdf_v326.js
      - AuthorizationBridge/**
      - .github/workflows/authorization-test-profiles.yml

jobs:
  offline-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AuthorizationBridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python signing and validation dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pypdf
      - name: Check frontend JavaScript syntax
        run: node --check ../authorization_pdf_v326.js
      - name: Offline regression tests - no external TSA calls
        run: python -m unittest -v test_signature_roundtrip test_pdf_ltv test_local_test_profiles
