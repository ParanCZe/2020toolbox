name: Build Agent Launcher RBZ

on:
  push:
    paths:
      - '.github/workflows/build-agent-launcher.yml'
      - 'SketchUpPlugins/AgentLauncherSource/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Validate Ruby syntax
        run: |
          ruby -c SketchUpPlugins/AgentLauncherSource/twentytwenty_agent_launcher.rb
          ruby -c SketchUpPlugins/AgentLauncherSource/twentytwenty_agent_launcher/main.rb
      - name: Build RBZ
        run: |
          cd SketchUpPlugins/AgentLauncherSource
          rm -f ../20-20_Agent_Launcher_v0.1.0.rbz
          zip -r ../20-20_Agent_Launcher_v0.1.0.rbz             twentytwenty_agent_launcher.rb             twentytwenty_agent_launcher
      - name: Commit RBZ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SketchUpPlugins/20-20_Agent_Launcher_v0.1.0.rbz
          if git diff --cached --quiet; then
            echo "RBZ unchanged"
            exit 0
          fi
          git commit -m "Build Agent Launcher v0.1.0"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push
