name: Publish RM Tools v1.0.0
on:
  push:
    branches: [main]
    paths:
      - 'SketchUpPlugins/20-20_RM_Tools_v1.0.0.rbz'
permissions:
  contents: write
jobs:
  patch-toolbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace RM Checker card with RM Tools
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          start=s.find("id:'rm-checker'")
          if start < 0:
              raise SystemExit("rm-checker block not found")
          block_start=s.rfind("{",0,start)
          versions=s.find("versions:[",start)
          if block_start < 0 or versions < 0:
              raise SystemExit("rm-checker registry block malformed")
          depth=0
          in_str=None
          esc=False
          block_end=None
          for i in range(block_start,len(s)):
              c=s[i]
              if in_str:
                  if esc: esc=False
                  elif c=="\\": esc=True
                  elif c==in_str: in_str=None
                  continue
              if c in "'\"\`": in_str=c; continue
              if c=="{": depth+=1
              elif c=="}":
                  depth-=1
                  if depth==0:
                      block_end=i+1
                      break
          if block_end is None:
              raise SystemExit("rm-checker block end not found")
          b=s[block_start:block_end]
          b=re.sub(r"name:'[^']*'","name:'20-20 RM Tools'",b,count=1)
          b=re.sub(r"current:'[^']*'","current:'1.0.0'",b,count=1)
          b=re.sub(r"description:'[^']*'","description:'Příprava modelu, záběru a kontrola před přenosem do RENDERMAKERU.'",b,count=1)
          b=re.sub(r"meta:'[^']*'","meta:'V1.0.0: tři záložky MODEL / ZÁBĚR / CHECKER podle příručky SketchUp → RENDERMAKER. Tagy, stíny, geolokace, číslo zakázky, rám/sklo, poměr záběru, kamera 1,8 m, dvoubodová perspektiva, pojmenované scény a rozšířená kontrola modelu.'",b,count=1)
          if '"version":"1.0.0"' not in b:
              pos=b.rfind("]")
              if pos < 0: raise SystemExit("versions array end not found")
              prefix=b[:pos].rstrip()
              if not prefix.endswith(","): prefix += ","
              entry='\n    {"version":"1.0.0","file":"20-20_RM_Tools_v1.0.0.rbz","size":11081,"repo_file":"SketchUpPlugins/20-20_RM_Tools_v1.0.0.rbz"}\n  '
              b=prefix+entry+b[pos:]
          s=s[:block_start]+b+s[block_end:]
          p.write_text(s,encoding="utf-8")
      - name: Commit toolbox registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Replace RM Checker with 20-20 RM Tools v1.0.0"
          git push
