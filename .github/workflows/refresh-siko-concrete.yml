name: Refresh SIKO Concrete Tile Catalog

on:
  push:
    paths:
      - '.github/workflows/refresh-siko-concrete.yml'
      - 'SketchUpPlugins/TextureLibrarySource/tools/scrape_siko_concrete.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4
      - name: Scrape SIKO concrete tiles
        run: python SketchUpPlugins/TextureLibrarySource/tools/scrape_siko_concrete.py
      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SketchUpPlugins/TextureLibrarySource/twentytwenty_texture_library/siko_concrete_tiles.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "Refresh SIKO concrete tile catalog"
            git push
          fi
