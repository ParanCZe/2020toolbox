name: Patch SketchUp Plugin Status UI

on:
  push:
    paths:
      - 'sketchup_plugin_status_v360.js'
      - '.github/workflows/patch-sketchup-plugin-status.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure one page-level status helper
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Remove every existing page/helper include, including accidentally
          # injected copies inside JavaScript template strings.
          s = re.sub(r'<script src="sketchup_plugin_status_v360\.js(?:\?v=\d+)?"></script>\s*', '', s)
          s = re.sub(r'<script src="sketchup_plugin_status_v360\.js(?:\?v=\d+)?"><\\/script>\s*', '', s)

          # Add exactly one real include, immediately before the final </body>.
          tag = '<script src="sketchup_plugin_status_v360.js?v=370"></script>\n'
          pos = s.rfind('</body>')
          if pos < 0:
              raise SystemExit('final </body> not found')
          s = s[:pos] + tag + s[pos:]
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Already patched"
            exit 0
          fi
          git commit -m "Keep SketchUp plugin status helper page-level only"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push race, retry $attempt..."
            sleep 2
          done
          exit 1
