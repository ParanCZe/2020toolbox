name: Patch SketchUp Plugin Status UI

on:
  push:
    paths:
      - 'sketchup_plugin_status_v360.js'
      - '.github/workflows/patch-sketchup-plugin-status.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject status helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          tag = '<script src="sketchup_plugin_status_v360.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s, encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Already patched"
            exit 0
          fi
          git commit -m "Load SketchUp plugin status helper"
          git push
