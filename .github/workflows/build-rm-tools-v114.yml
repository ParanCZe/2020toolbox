name: Build RM Tools v1.1.4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rm-tools-v114.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch focus finding
        shell: python
        run: |
          from pathlib import Path
          import zipfile,tempfile,shutil
          src=Path('SketchUpPlugins/20-20_RM_Tools_v1.1.3.rbz')
          dst=Path('SketchUpPlugins/20-20_RM_Tools_v1.1.4.rbz')
          tmp=Path(tempfile.mkdtemp())
          with zipfile.ZipFile(src) as z: z.extractall(tmp)
          loader=tmp/'twentytwenty_rm_checker.rb'
          main=tmp/'twentytwenty_rm_checker'/'main.rb'
          loader.write_text(loader.read_text(encoding='utf-8').replace("EXTENSION_VERSION = '1.1.3'","EXTENSION_VERSION = '1.1.4'"),encoding='utf-8')
          s=main.read_text(encoding='utf-8').replace("VERSION = '1.1.3'","VERSION = '1.1.4'")
          old="""    def focus_finding(ids_json)
      ids = JSON.parse(ids_json) rescue []
      ids = Array(ids).map(&:to_i).uniq.first(30)
      return notify('U tohoto nálezu není konkrétní objekt k zaměření.', 'warn') if ids.empty?
      boxes = []
      ids.each do |id|
        hit = find_entity_by_id(model.entities, [id])
        boxes << transformed_bounds(hit[0], hit[1]) if hit
      end
      boxes.reject! { |bb| !bb.valid? }
      return notify('Objekt už v modelu není nebo ho nelze zaměřit.', 'warn') if boxes.empty?
      all = Geom::BoundingBox.new
      boxes.each { |bb| 8.times { |i| all.add(bb.corner(i)) } }
      model.active_view.zoom(all)
      model.select_tool(FindingHighlighter.new(boxes))
      model.active_view.invalidate
      notify('Nález je zaměřený a zvýrazněný červeně. Kliknutím v modelu zvýraznění ukončíš.')
    rescue StandardError => e
      notify("Zaměření nálezu: #{e.message}", 'error')
    end
"""
          new="""    def focus_finding(ids_json)
      ids = JSON.parse(ids_json) rescue []
      ids = Array(ids).map(&:to_i).uniq.first(30)
      return notify('U tohoto nálezu není konkrétní objekt k zaměření.', 'warn') if ids.empty?

      boxes = []
      zoom_entity = nil
      ids.each do |id|
        hit = find_entity_by_id(model.entities, [id])
        next unless hit
        entity, tr = hit
        next unless entity.respond_to?(:valid?) ? entity.valid? : true
        zoom_entity ||= entity
        bb = transformed_bounds(entity, tr)
        boxes << bb if bb.valid?
      end

      return notify('Objekt už v modelu není nebo ho nelze zaměřit.', 'warn') if boxes.empty? || zoom_entity.nil?

      begin
        model.active_view.zoom(zoom_entity)
      rescue StandardError
        model.active_view.zoom_extents
      end

      model.select_tool(FindingHighlighter.new(boxes))
      model.active_view.invalidate
      notify('Nález je zaměřený a zvýrazněný červeně. Kliknutím v modelu zvýraznění ukončíš.')
    rescue StandardError => e
      notify("Zaměření nálezu: #{e.message}", 'error')
    end
"""
          if old not in s: raise SystemExit('focus block not found')
          main.write_text(s.replace(old,new),encoding='utf-8')
          with zipfile.ZipFile(dst,'w',zipfile.ZIP_DEFLATED) as z:
            for p in tmp.rglob('*'):
              if p.is_file(): z.write(p,p.relative_to(tmp).as_posix())
          with zipfile.ZipFile(dst) as z:
            bad=z.testzip()
            if bad: raise SystemExit('bad member '+bad)
          shutil.rmtree(tmp)
      - name: Commit package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SketchUpPlugins/20-20_RM_Tools_v1.1.4.rbz
          git commit -m "Fix RM Tools finding focus v1.1.4"
          git push
