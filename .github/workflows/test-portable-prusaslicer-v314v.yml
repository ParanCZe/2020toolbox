name: Test V3.14v Portable PrusaSlicer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-portable-prusaslicer-v314v.yml']
  workflow_dispatch:

jobs:
  test-portable-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose clean portable runtime presets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'toolbox-localappdata'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $exe = Join-Path $PWD 'PrusaBridge\20-20-PrusaBridge.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--serve' -PassThru -WindowStyle Hidden
          try {
            $status=$null
            for($i=0;$i -lt 120;$i++){
              Start-Sleep -Seconds 2
              try{$status=Invoke-RestMethod 'http://127.0.0.1:8091/status' -TimeoutSec 3}catch{continue}
              Write-Host ("ready={0} managed={1} boot={2} {3}" -f $status.ok,$status.slicerManaged,$status.slicerBootstrapping,$status.slicerBootstrapStatus)
              if($status.ok){break}
              if($status.slicerBootstrapError){throw $status.slicerBootstrapError}
            }
            if(-not $status.ok -or -not $status.slicerManaged){throw 'portable runtime not ready'}
            $root=Join-Path $env:LOCALAPPDATA '20-20-TOOLBOX\PrusaBridge\Slicer'
            Write-Host "SLICER=$($status.slicerPath)"
            Write-Host '--- RELEVANT FILES ---'
            Get-ChildItem $root -Recurse -File | Where-Object {$_.Name -match 'RepositoryManifest|vendor\.(yaml|ini)|PrusaResearch|MK3|preset|config'} | Select-Object -First 160 | ForEach-Object {Write-Host $_.FullName.Substring($root.Length)}
            $man=Get-ChildItem $root -Recurse -Filter RepositoryManifest.json -File | Select-Object -First 1
            if($man){Write-Host "MANIFEST=$($man.FullName)";Get-Content $man.FullName -TotalCount 80 | Write-Host}
            $vendor=Get-ChildItem $root -Recurse -Filter vendor.yaml -File | Where-Object {$_.FullName -match 'PrusaResearch'} | Select-Object -First 1
            if($vendor){Write-Host "VENDOR=$($vendor.FullName)";Get-Content $vendor.FullName -TotalCount 80 | Write-Host}

            $datadir=Join-Path $env:RUNNER_TEMP 'prusa-datadir'
            New-Item -ItemType Directory -Force $datadir | Out-Null
            foreach($mode in @('default','empty-datadir')){
              $out=Join-Path $env:RUNNER_TEMP ("models-$mode.json")
              if($mode -eq 'default'){$args=@('--query-printer-models','-o',$out)}else{$args=@('--datadir',$datadir,'--query-printer-models','-o',$out)}
              Write-Host "--- QUERY $mode ---"
              & $status.slicerPath @args 2>&1 | ForEach-Object {Write-Host $_}
              Write-Host "EXIT=$LASTEXITCODE OUT=$((Test-Path $out))"
              if(Test-Path $out){Get-Content $out -TotalCount 100 | Write-Host}
            }
          } finally { try{Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}catch{} }
