name: Test V3.14v Portable PrusaSlicer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-portable-prusaslicer-v314v.yml']
  workflow_dispatch:

jobs:
  test-portable-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test clean portable runtime with managed presets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'toolbox-localappdata'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $exe = Join-Path $PWD 'PrusaBridge\20-20-PrusaBridge.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--serve' -PassThru -WindowStyle Hidden
          try {
            $status=$null
            for($i=0;$i -lt 120;$i++){
              Start-Sleep -Seconds 2
              try{$status=Invoke-RestMethod 'http://127.0.0.1:8091/status' -TimeoutSec 3}catch{continue}
              Write-Host ("ready={0} managed={1} boot={2} {3}" -f $status.ok,$status.slicerManaged,$status.slicerBootstrapping,$status.slicerBootstrapStatus)
              if($status.ok){break}
              if($status.slicerBootstrapError){throw $status.slicerBootstrapError}
            }
            if(-not $status.ok -or -not $status.slicerManaged){throw 'portable runtime not ready'}

            $runtime = Split-Path $status.slicerPath -Parent
            $profiles = Join-Path $runtime 'resources\profiles'
            $datadir = Join-Path $env:LOCALAPPDATA '20-20-TOOLBOX\PrusaBridge\PrusaData'
            $vendorDir = Join-Path $datadir 'vendor'
            New-Item -ItemType Directory -Force $vendorDir | Out-Null
            Copy-Item (Join-Path $profiles 'PrusaResearch.ini') (Join-Path $vendorDir 'PrusaResearch.ini') -Force
            Copy-Item (Join-Path $profiles 'PrusaResearch.idx') (Join-Path $vendorDir 'PrusaResearch.idx') -Force
            @'
          [presets]
          filament = Prusament PLA
          print = 0.20mm QUALITY @MK3
          printer = Original Prusa i3 MK3S & MK3S+

          [vendor:PrusaResearch]
          model:MK3S = 0.4
          '@ | Set-Content -Encoding UTF8 (Join-Path $datadir 'PrusaSlicer.ini')

            Write-Host "DATADIR=$datadir"
            Get-ChildItem $datadir -Recurse | ForEach-Object { Write-Host $_.FullName }

            $out=Join-Path $env:RUNNER_TEMP 'models.json'
            & $status.slicerPath --datadir $datadir --query-printer-models -o $out 2>&1 | ForEach-Object {Write-Host $_}
            Write-Host "QUERY_EXIT=$LASTEXITCODE OUT=$((Test-Path $out))"
            if($LASTEXITCODE -ne 0){throw 'query-printer-models failed'}
            if(Test-Path $out){Get-Content $out -TotalCount 80 | Write-Host}

            $stl=Join-Path $env:RUNNER_TEMP 'cube.stl'
            @'
          solid cube
            facet normal 0 0 -1
              outer loop
                vertex 0 0 0
                vertex 20 20 0
                vertex 20 0 0
              endloop
            endfacet
            facet normal 0 0 -1
              outer loop
                vertex 0 0 0
                vertex 0 20 0
                vertex 20 20 0
              endloop
            endfacet
            facet normal 0 0 1
              outer loop
                vertex 0 0 20
                vertex 20 0 20
                vertex 20 20 20
              endloop
            endfacet
            facet normal 0 0 1
              outer loop
                vertex 0 0 20
                vertex 20 20 20
                vertex 0 20 20
              endloop
            endfacet
            facet normal 0 -1 0
              outer loop
                vertex 0 0 0
                vertex 20 0 0
                vertex 20 0 20
              endloop
            endfacet
            facet normal 0 -1 0
              outer loop
                vertex 0 0 0
                vertex 20 0 20
                vertex 0 0 20
              endloop
            endfacet
            facet normal 0 1 0
              outer loop
                vertex 0 20 0
                vertex 0 20 20
                vertex 20 20 20
              endloop
            endfacet
            facet normal 0 1 0
              outer loop
                vertex 0 20 0
                vertex 20 20 20
                vertex 20 20 0
              endloop
            endfacet
            facet normal -1 0 0
              outer loop
                vertex 0 0 0
                vertex 0 0 20
                vertex 0 20 20
              endloop
            endfacet
            facet normal -1 0 0
              outer loop
                vertex 0 0 0
                vertex 0 20 20
                vertex 0 20 0
              endloop
            endfacet
            facet normal 1 0 0
              outer loop
                vertex 20 0 0
                vertex 20 20 0
                vertex 20 20 20
              endloop
            endfacet
            facet normal 1 0 0
              outer loop
                vertex 20 0 0
                vertex 20 20 20
                vertex 20 0 20
              endloop
            endfacet
          endsolid cube
          '@ | Set-Content -Encoding ASCII $stl

            $gcode=Join-Path $env:RUNNER_TEMP 'cube.gcode'
            & $status.slicerPath --datadir $datadir -g --printer-profile 'Original Prusa i3 MK3S & MK3S+' --print-profile '0.20mm QUALITY @MK3' --material-profile 'Prusament PLA' -o $gcode $stl 2>&1 | ForEach-Object {Write-Host $_}
            Write-Host "SLICE_EXIT=$LASTEXITCODE GCODE=$((Test-Path $gcode))"
            if($LASTEXITCODE -ne 0){throw 'portable slice failed'}
            if(-not (Test-Path $gcode)){throw 'gcode missing'}
            $len=(Get-Item $gcode).Length
            if($len -lt 1000){throw "gcode too small: $len"}
            Write-Host "PORTABLE_PRESETS_AND_SLICE_OK $len bytes"
          } finally { try{Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}catch{} }
