name: Test V3.14v Portable PrusaSlicer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-portable-prusaslicer-v314v.yml']
  workflow_dispatch:

jobs:
  test-portable-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe managed presets in clean portable runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'toolbox-localappdata'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $exe = Join-Path $PWD 'PrusaBridge\20-20-PrusaBridge.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--serve' -PassThru -WindowStyle Hidden
          try {
            $status=$null
            for($i=0;$i -lt 120;$i++){
              Start-Sleep -Seconds 2
              try{$status=Invoke-RestMethod 'http://127.0.0.1:8091/status' -TimeoutSec 3}catch{continue}
              Write-Host ("ready={0} managed={1} boot={2} {3}" -f $status.ok,$status.slicerManaged,$status.slicerBootstrapping,$status.slicerBootstrapStatus)
              if($status.ok){break}
              if($status.slicerBootstrapError){throw $status.slicerBootstrapError}
            }
            if(-not $status.ok -or -not $status.slicerManaged){throw 'portable runtime not ready'}
            $runtime = Split-Path $status.slicerPath -Parent
            $profiles = Join-Path $runtime 'resources\profiles'
            $datadir = Join-Path $env:LOCALAPPDATA '20-20-TOOLBOX\PrusaBridge\PrusaData'
            $vendorDir = Join-Path $datadir 'vendor'
            New-Item -ItemType Directory -Force $vendorDir | Out-Null
            Copy-Item (Join-Path $profiles 'PrusaResearch.ini') (Join-Path $vendorDir 'PrusaResearch.ini') -Force
            Copy-Item (Join-Path $profiles 'PrusaResearch.idx') (Join-Path $vendorDir 'PrusaResearch.idx') -Force
            $cfg = "[presets]`r`nfilament = Prusament PLA`r`nprint = 0.20mm QUALITY @MK3`r`nprinter = Original Prusa i3 MK3S & MK3S+`r`n`r`n[vendor:PrusaResearch]`r`nmodel:MK3S = 0.4`r`n"
            [IO.File]::WriteAllText((Join-Path $datadir 'PrusaSlicer.ini'), $cfg, [Text.Encoding]::ASCII)

            $old=$ErrorActionPreference; $ErrorActionPreference='Continue'
            $models=Join-Path $env:RUNNER_TEMP 'models.json'
            & $status.slicerPath --datadir $datadir --query-printer-models -o $models 2>&1 | ForEach-Object {Write-Host $_}
            Write-Host "MODELS_EXIT=$LASTEXITCODE OUT=$((Test-Path $models))"
            if(-not (Test-Path $models)){throw 'printer models output missing'}
            Get-Content $models -TotalCount 120 | Write-Host

            $profilesOut=Join-Path $env:RUNNER_TEMP 'profiles.json'
            & $status.slicerPath --datadir $datadir --printer-profile 'Original Prusa i3 MK3S & MK3S+' --query-print-tool-filament-profiles -o $profilesOut 2>&1 | ForEach-Object {Write-Host $_}
            Write-Host "PROFILES_EXIT=$LASTEXITCODE OUT=$((Test-Path $profilesOut))"
            $ErrorActionPreference=$old
            if(-not (Test-Path $profilesOut)){throw 'profile output missing'}
            Get-Content $profilesOut -TotalCount 240 | Write-Host
            $txt=Get-Content $profilesOut -Raw
            if($txt -notmatch '0.20mm QUALITY @MK3'){throw 'MK3 print profile missing'}
            if($txt -notmatch 'Prusament PLA'){throw 'PLA material profile missing'}
            Write-Host 'PORTABLE_PRESETS_OK'
          } finally { try{Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}catch{} }
