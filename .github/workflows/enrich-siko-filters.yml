name: Enrich SIKO Material Filters

on:
  push:
    paths:
      - '.github/workflows/enrich-siko-filters.yml'
      - 'SketchUpPlugins/TextureLibrarySource/tools/enrich_siko_filters.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pillow
      - name: Enrich SIKO catalogs
        run: python SketchUpPlugins/TextureLibrarySource/tools/enrich_siko_filters.py
      - name: Commit enriched catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SketchUpPlugins/TextureLibrarySource/twentytwenty_texture_library/siko_concrete_tiles.json
          git add SketchUpPlugins/TextureLibrarySource/twentytwenty_texture_library/siko_floor_tiles.json
          if git diff --cached --quiet; then
            echo "Catalog filters unchanged"
          else
            git commit -m "Enrich SIKO material filters"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main
            done
            git push
          fi
