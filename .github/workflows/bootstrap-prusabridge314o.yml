name: Build PrusaBridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-prusabridge314o.yml'
      - 'PrusaBridge/src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Bridge V3.14q launch fixes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          p = Path('PrusaBridge/src/main.go')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const bridgeVersion = "3.14p"', 'const bridgeVersion = "3.14q"')

          # Go raw string literals do not process escapes. The previous registry keys
          # contained two literal backslashes, so Windows could fail to register the
          # toolbox-prusa:// protocol. Use one real registry separator in raw literals.
          s = s.replace(r'`HKCU\\Software\\Classes\\toolbox-prusa`', r'`HKCU\Software\Classes\toolbox-prusa`')
          s = s.replace(r'`HKCU\\Software\\Classes\\toolbox-prusa\\DefaultIcon`', r'`HKCU\Software\Classes\toolbox-prusa\DefaultIcon`')
          s = s.replace(r'`HKCU\\Software\\Classes\\toolbox-prusa\\shell\\open\\command`', r'`HKCU\Software\Classes\toolbox-prusa\shell\open\command`')
          p.write_text(s, encoding='utf-8')

          i = Path('index.html')
          h = i.read_text(encoding='utf-8')
          h = h.replace('3.14p', '3.14q')

          old_btn = '<a id="print3d-prusa-start-btn" class="back-btn" style="margin:0;display:inline-flex;align-items:center;text-decoration:none" href="toolbox-prusa://start" onclick="poll3DPrintPrusaBridgeStart()">▶ Spustit PrusaBridge</a>'
          new_btn = '<button id="print3d-prusa-start-btn" class="back-btn" style="margin:0;display:inline-flex;align-items:center" onclick="start3DPrintPrusaBridge()">▶ Spustit PrusaBridge</button>'
          h = h.replace(old_btn, new_btn)

          marker = 'function poll3DPrintPrusaBridgeStart(){'
          starter = r'''async function start3DPrintPrusaBridge(){
            const box=document.getElementById('print3d-prusa-bridge-status');
            try{if(await check3DPrintPrusaBridge(true))return}catch{}
            if(box){box.className='print3d-health warn';box.innerHTML='<b>Spouštím PrusaBridge…</b><br>Zkouším registrovaný protokol <code>toolbox-prusa://</code>.'}
            const frame=document.createElement('iframe');
            frame.style.display='none';
            frame.src='toolbox-prusa://start';
            document.body.appendChild(frame);
            poll3DPrintPrusaBridgeStart();
            setTimeout(async()=>{
              let ok=false;try{ok=await check3DPrintPrusaBridge(true)}catch{}
              try{frame.remove()}catch{}
              if(ok)return;
              if(box){box.className='print3d-health warn';box.innerHTML='<b>⚠ PRUSABRIDGE SE NESPustil</b><br>Protokol ještě není ve Windows zaregistrovaný. Stahuji aktuální Bridge 3.14q — EXE je potřeba <b>jen jednou ručně spustit</b>. Potom bude tlačítko fungovat přímo z webu.'}
              download3DPrintPrusaBridge();
            },2600);
          }
          '''
          if marker in h and 'function start3DPrintPrusaBridge()' not in h:
              h = h.replace(marker, starter + marker, 1)
          i.write_text(h, encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "V3.14q patch failed: $LASTEXITCODE" }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build native WinRT repair helper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $sdk = Get-ChildItem $sdkRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Windows SDK include directory not found.' }
          $cppwinrt = Join-Path $sdk.FullName 'cppwinrt'
          if (-not (Test-Path $cppwinrt)) { throw "C++/WinRT headers not found: $cppwinrt" }
          cl /nologo /std:c++20 /EHsc /O2 /DUNICODE /D_UNICODE /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /I"$cppwinrt" PrusaBridge\src\Win3DRepair.cpp /Fe:PrusaBridge\src\Win3DRepair.exe /link windowsapp.lib
          if ($LASTEXITCODE -ne 0) { throw "Win3DRepair build failed: $LASTEXITCODE" }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Build PrusaBridge
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cpp = Join-Path $PWD 'PrusaBridge\src\Win3DRepair.cpp'
          $tmpCpp = Join-Path $env:RUNNER_TEMP 'Win3DRepair.cpp'
          Move-Item $cpp $tmpCpp -Force
          try {
            Push-Location PrusaBridge\src
            try {
              go build -trimpath -ldflags "-H=windowsgui -s -w" -o ..\20-20-PrusaBridge.exe .
              if ($LASTEXITCODE -ne 0) { throw "PrusaBridge build failed: $LASTEXITCODE" }
            } finally {
              Pop-Location
            }
          } finally {
            Move-Item $tmpCpp $cpp -Force
          }

      - name: Create update manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'PrusaBridge\20-20-PrusaBridge.exe'
          if (-not (Test-Path $exe)) { throw 'Built PrusaBridge EXE is missing.' }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = '3.14q'
            url = 'https://raw.githubusercontent.com/ParanCZe/2020toolbox/main/PrusaBridge/20-20-PrusaBridge.exe'
            sha256 = $sha
          } | ConvertTo-Json
          Set-Content -Path 'PrusaBridge\latest.json' -Value $manifest -Encoding UTF8

      - name: Commit Bridge V3.14q
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name '20-20 Bridge Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrusaBridge/src/main.go PrusaBridge/src/Win3DRepair.cpp PrusaBridge/src/go.mod PrusaBridge/20-20-PrusaBridge.exe PrusaBridge/latest.json index.html
          if (git diff --cached --quiet) {
            Write-Host 'No changes.'
            exit 0
          }
          git commit -m 'PrusaBridge 3.14q launch protocol fix'
          git push origin main
