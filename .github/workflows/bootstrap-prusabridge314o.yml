name: Build PrusaBridge

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-prusabridge314o.yml
      - PrusaBridge/src/**
      - SketchUpExtension/**
      - sketchup_extension_button_v330.js
      - tools/patch_print_recommendations_v314t.py
      - tools/patch_main_menu_v314u.py
      - tools/patch_portable_prusaslicer_v314v.py
      - tools/patch_sketchup_bridge_v314w.py
      - tools/patch_print3d_preserve_orientation_v329.py
      - tools/patch_sketchup_extension_button_v330.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Bridge and web app
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'PrusaBridge\src\main.go'
          $s = Get-Content -Raw -Encoding UTF8 $p
          $s = $s.Replace('const bridgeVersion = "3.14r"', 'const bridgeVersion = "3.14s"')
          $s = $s.Replace('args = append(args, "--support-material", "1", "--support-material-buildplate-only", "1")', 'args = append(args, "--support-material", "--support-material-buildplate-only")')
          $s = $s.Replace('args = append(args, "--support-material", "1", "--support-material-buildplate-only", "0")', 'args = append(args, "--support-material")')
          $s = $s.Replace('args = append(args, "--support-material", "0")', '// support disabled: no boolean CLI flag')
          Set-Content -Encoding UTF8 -Path $p -Value $s

          python tools\patch_print_recommendations_v314t.py
          if ($LASTEXITCODE -ne 0) { throw "V3.14t recommendation patch failed: $LASTEXITCODE" }
          python tools\patch_main_menu_v314u.py
          if ($LASTEXITCODE -ne 0) { throw "V3.14u main-menu patch failed: $LASTEXITCODE" }

          # The repository is already on Bridge 3.14w. Old migration patchers are
          # intentionally skipped on current builds because they expect 3.14t/v input.
          $bridgeNow = Get-Content -Raw -Encoding UTF8 $p
          if (-not $bridgeNow.Contains('const bridgeVersion = "3.14w"')) {
            python tools\patch_portable_prusaslicer_v314v.py
            if ($LASTEXITCODE -ne 0) { throw "V3.14v portable PrusaSlicer patch failed: $LASTEXITCODE" }
            python tools\patch_sketchup_bridge_v314w.py
            if ($LASTEXITCODE -ne 0) { throw "V3.14w SketchUp bridge patch failed: $LASTEXITCODE" }
          }

          python tools\patch_print3d_preserve_orientation_v329.py
          if ($LASTEXITCODE -ne 0) { throw "V3.29 orientation patch failed: $LASTEXITCODE" }
          python tools\patch_sketchup_extension_button_v330.py
          if ($LASTEXITCODE -ne 0) { throw "V3.30 SketchUp extension button patch failed: $LASTEXITCODE" }

          $main = Get-Content -Raw -Encoding UTF8 $p
          if (-not $main.Contains('const bridgeVersion = "3.14w"')) { throw 'Bridge 3.14w version patch failed' }
          if ($main.Contains('"--support-material", "1"')) { throw 'Boolean CLI fix did not apply' }
          if (-not $main.Contains('startPortableSlicerBootstrap')) { throw 'Portable slicer bootstrap missing' }
          if (-not $main.Contains('ensureManagedSlicerData')) { throw 'Managed PrusaSlicer datadir missing' }
          if (-not $main.Contains('handleSketchupImport')) { throw 'SketchUp upload endpoint missing' }
          if (-not $main.Contains('handleSketchupFile')) { throw 'SketchUp file endpoint missing' }
          $html = Get-Content -Raw -Encoding UTF8 index.html
          if (-not $html.Contains('id="print3d-priority"')) { throw 'Priority selector was not added' }
          if (-not $html.Contains('analyze3DPrintRecommendationGeometry')) { throw 'Smart recommendation function missing' }
          if (-not $html.Contains('class="menu-app-groups"')) { throw 'V3.14u main menu layout missing' }
          if (-not $html.Contains('session-data-mb')) { throw 'V3.14u data overview missing' }
          if (-not $html.Contains("PRINT3D_PRUSA_BRIDGE_EXPECTED='3.14w'")) { throw 'Web does not expect Bridge 3.14w' }
          if ($html.Contains('await autoAlign3DPrintModel(true);apply3DPrintRecommendedSettings(false)')) { throw 'Simple prepare still auto-rotates model' }
          if ($html.Contains('update3DPrintTransform();await autoAlign3DPrintModel(true);fit3DPrintView(true)')) { throw 'Model load still auto-rotates model' }
          if (-not $html.Contains('sketchup_extension_button_v330.js')) { throw 'SketchUp extension button loader missing' }

      - name: Package SketchUp RBZ
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP '20-20-sketchup-rbz'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          New-Item -ItemType Directory -Path $tmp | Out-Null
          Copy-Item 'SketchUpExtension\20_20_toolbox.rb' $tmp
          Copy-Item 'SketchUpExtension\twenty_twenty_toolbox' $tmp -Recurse
          Copy-Item 'icon.png' (Join-Path $tmp 'twenty_twenty_toolbox\toolbox_icon.png') -Force
          $zip = Join-Path $env:RUNNER_TEMP '20-20-Toolbox-Print.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $tmp '*') -DestinationPath $zip -CompressionLevel Optimal
          Copy-Item $zip 'SketchUpExtension\20-20-Toolbox-Print.rbz' -Force

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build native WinRT repair helper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $sdk = Get-ChildItem $sdkRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Windows SDK include directory not found." }
          $cppwinrt = Join-Path $sdk.FullName 'cppwinrt'
          if (-not (Test-Path $cppwinrt)) { throw "C++/WinRT headers not found: $cppwinrt" }
          cl /nologo /std:c++20 /EHsc /O2 /DUNICODE /D_UNICODE /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /I"$cppwinrt" PrusaBridge\src\Win3DRepair.cpp /Fe:PrusaBridge\src\Win3DRepair.exe /link windowsapp.lib
          if ($LASTEXITCODE -ne 0) { throw "Win3DRepair build failed: $LASTEXITCODE" }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false

      - name: Build PrusaBridge
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cpp = Join-Path $PWD 'PrusaBridge\src\Win3DRepair.cpp'
          $tmpCpp = Join-Path $env:RUNNER_TEMP 'Win3DRepair.cpp'
          Move-Item $cpp $tmpCpp -Force
          try {
            Push-Location PrusaBridge\src
            try {
              gofmt -w main.go
              go build -trimpath -ldflags "-H=windowsgui -s -w" -o ..\20-20-PrusaBridge.exe .
              if ($LASTEXITCODE -ne 0) { throw "PrusaBridge build failed: $LASTEXITCODE" }
            } finally {
              Pop-Location
            }
          } finally {
            Move-Item $tmpCpp $cpp -Force
          }

      - name: Create update manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'PrusaBridge\20-20-PrusaBridge.exe'
          if (-not (Test-Path $exe)) { throw 'Built PrusaBridge EXE is missing.' }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = '3.14w'
            url = 'https://raw.githubusercontent.com/ParanCZe/2020toolbox/main/PrusaBridge/20-20-PrusaBridge.exe'
            sha256 = $sha
          } | ConvertTo-Json
          [IO.File]::WriteAllText((Join-Path $PWD 'PrusaBridge\latest.json'), $manifest + "`n", [Text.UTF8Encoding]::new($false))

      - name: Commit V3.14w SketchUp handoff runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name '20-20 Bridge Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrusaBridge/src/main.go PrusaBridge/src/Win3DRepair.cpp PrusaBridge/src/go.mod PrusaBridge/20-20-PrusaBridge.exe PrusaBridge/latest.json index.html SketchUpExtension/20-20-Toolbox-Print.rbz
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'V3.30 add SketchUp extension download in 3D print'
          git push origin main
