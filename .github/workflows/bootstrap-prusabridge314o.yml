name: Build PrusaBridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-prusabridge314o.yml'
      - 'PrusaBridge/src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Bridge V3.14s PrusaSlicer CLI fix
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          p = Path('PrusaBridge/src/main.go')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const bridgeVersion = "3.14r"', 'const bridgeVersion = "3.14s"')

          old = '''\tswitch strings.ToLower(s.Supports) {
\tcase "buildplate":
\t\targs = append(args, "--support-material", "1", "--support-material-buildplate-only", "1")
\tcase "everywhere":
\t\targs = append(args, "--support-material", "1", "--support-material-buildplate-only", "0")
\tdefault:
\t\targs = append(args, "--support-material", "0")
\t}'''
          new = '''\tswitch strings.ToLower(s.Supports) {
\tcase "buildplate":
\t\t// PrusaSlicer boolean CLI switches are flags. Passing a separate "1"
\t\t// makes PrusaSlicer interpret that token as an input filename ("No such file: 1").
\t\targs = append(args, "--support-material", "--support-material-buildplate-only")
\tcase "everywhere":
\t\targs = append(args, "--support-material")
\tdefault:
\t\t// Support is disabled by the selected print profile by default; do not append
\t\t// a synthetic "0" token because it is parsed as a filename by the CLI.
\t}'''
          if old not in s:
              raise SystemExit('Expected support-material CLI block was not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          i = Path('index.html')
          h = i.read_text(encoding='utf-8').replace('3.14r', '3.14s')
          h = h.replace('Stahuji Bridge 3.14r', 'Stahuji Bridge 3.14s')
          i.write_text(h, encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "V3.14s patch failed: $LASTEXITCODE" }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build native WinRT repair helper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $sdk = Get-ChildItem $sdkRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Windows SDK include directory not found.' }
          $cppwinrt = Join-Path $sdk.FullName 'cppwinrt'
          if (-not (Test-Path $cppwinrt)) { throw "C++/WinRT headers not found: $cppwinrt" }
          cl /nologo /std:c++20 /EHsc /O2 /DUNICODE /D_UNICODE /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /I"$cppwinrt" PrusaBridge\src\Win3DRepair.cpp /Fe:PrusaBridge\src\Win3DRepair.exe /link windowsapp.lib
          if ($LASTEXITCODE -ne 0) { throw "Win3DRepair build failed: $LASTEXITCODE" }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Build PrusaBridge
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cpp = Join-Path $PWD 'PrusaBridge\src\Win3DRepair.cpp'
          $tmpCpp = Join-Path $env:RUNNER_TEMP 'Win3DRepair.cpp'
          Move-Item $cpp $tmpCpp -Force
          try {
            Push-Location PrusaBridge\src
            try {
              go build -trimpath -ldflags "-H=windowsgui -s -w" -o ..\20-20-PrusaBridge.exe .
              if ($LASTEXITCODE -ne 0) { throw "PrusaBridge build failed: $LASTEXITCODE" }
            } finally {
              Pop-Location
            }
          } finally {
            Move-Item $tmpCpp $cpp -Force
          }

      - name: Create update manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'PrusaBridge\20-20-PrusaBridge.exe'
          if (-not (Test-Path $exe)) { throw 'Built PrusaBridge EXE is missing.' }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = '3.14s'
            url = 'https://raw.githubusercontent.com/ParanCZe/2020toolbox/main/PrusaBridge/20-20-PrusaBridge.exe'
            sha256 = $sha
          } | ConvertTo-Json
          Set-Content -Path 'PrusaBridge\latest.json' -Value $manifest -Encoding UTF8

      - name: Commit Bridge V3.14s
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name '20-20 Bridge Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrusaBridge/src/main.go PrusaBridge/src/Win3DRepair.cpp PrusaBridge/src/go.mod PrusaBridge/20-20-PrusaBridge.exe PrusaBridge/latest.json index.html
          if (git diff --cached --quiet) {
            Write-Host 'No changes.'
            exit 0
          }
          git commit -m 'PrusaBridge 3.14s PrusaSlicer CLI boolean fix'
          git push origin main
