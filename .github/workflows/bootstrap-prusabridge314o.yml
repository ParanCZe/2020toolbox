name: Build PrusaBridge

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-prusabridge314o.yml
      - PrusaBridge/src/**
      - tools/patch_print_recommendations_v314t.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Bridge and V3.14t web recommendations
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'PrusaBridge\src\main.go'
          $s = Get-Content -Raw -Encoding UTF8 $p
          $s = $s.Replace('const bridgeVersion = "3.14r"', 'const bridgeVersion = "3.14s"')
          $s = $s.Replace('args = append(args, "--support-material", "1", "--support-material-buildplate-only", "1")', 'args = append(args, "--support-material", "--support-material-buildplate-only")')
          $s = $s.Replace('args = append(args, "--support-material", "1", "--support-material-buildplate-only", "0")', 'args = append(args, "--support-material")')
          $s = $s.Replace('args = append(args, "--support-material", "0")', '// support disabled: no boolean CLI flag')
          Set-Content -Encoding UTF8 -Path $p -Value $s

          python tools\patch_print_recommendations_v314t.py
          if ($LASTEXITCODE -ne 0) { throw "V3.14t recommendation patch failed: $LASTEXITCODE" }

          if (-not ((Get-Content -Raw $p).Contains('const bridgeVersion = "3.14s"'))) { throw 'Bridge version patch failed' }
          if ((Get-Content -Raw $p).Contains('"--support-material", "1"')) { throw 'Boolean CLI fix did not apply' }
          if (-not ((Get-Content -Raw -Encoding UTF8 index.html).Contains('id="print3d-priority"'))) { throw 'Priority selector was not added' }
          if (-not ((Get-Content -Raw -Encoding UTF8 index.html).Contains('analyze3DPrintRecommendationGeometry'))) { throw 'Smart recommendation function missing' }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build native WinRT repair helper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $sdk = Get-ChildItem $sdkRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Windows SDK include directory not found.' }
          $cppwinrt = Join-Path $sdk.FullName 'cppwinrt'
          if (-not (Test-Path $cppwinrt)) { throw "C++/WinRT headers not found: $cppwinrt" }
          cl /nologo /std:c++20 /EHsc /O2 /DUNICODE /D_UNICODE /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /I"$cppwinrt" PrusaBridge\src\Win3DRepair.cpp /Fe:PrusaBridge\src\Win3DRepair.exe /link windowsapp.lib
          if ($LASTEXITCODE -ne 0) { throw "Win3DRepair build failed: $LASTEXITCODE" }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false

      - name: Build PrusaBridge
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cpp = Join-Path $PWD 'PrusaBridge\src\Win3DRepair.cpp'
          $tmpCpp = Join-Path $env:RUNNER_TEMP 'Win3DRepair.cpp'
          Move-Item $cpp $tmpCpp -Force
          try {
            Push-Location PrusaBridge\src
            try {
              go build -trimpath -ldflags "-H=windowsgui -s -w" -o ..\20-20-PrusaBridge.exe .
              if ($LASTEXITCODE -ne 0) { throw "PrusaBridge build failed: $LASTEXITCODE" }
            } finally {
              Pop-Location
            }
          } finally {
            Move-Item $tmpCpp $cpp -Force
          }

      - name: Create update manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'PrusaBridge\20-20-PrusaBridge.exe'
          if (-not (Test-Path $exe)) { throw 'Built PrusaBridge EXE is missing.' }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = '3.14s'
            url = 'https://raw.githubusercontent.com/ParanCZe/2020toolbox/main/PrusaBridge/20-20-PrusaBridge.exe'
            sha256 = $sha
          } | ConvertTo-Json
          Set-Content -Encoding UTF8 -Path 'PrusaBridge\latest.json' -Value $manifest

      - name: Commit V3.14t web and Bridge 3.14s
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name '20-20 Bridge Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrusaBridge/src/main.go PrusaBridge/src/Win3DRepair.cpp PrusaBridge/src/go.mod PrusaBridge/20-20-PrusaBridge.exe PrusaBridge/latest.json index.html
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'V3.14t model-aware print recommendations'
          git push origin main
