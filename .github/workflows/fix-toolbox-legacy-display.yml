name: Fix Toolbox Legacy plugins layout
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-toolbox-legacy-display.yml"
      - "SketchUpPlugins/tests/test_legacy_renderer_fixed_v2047.js"
      - "sketchup_plugin_status_v360.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bust old SketchUp plugin status script and preserve entire catalog
        shell: python
        run: |
          from pathlib import Path
          import re
          page=Path("index.html")
          html=page.read_text(encoding="utf-8")
          old='sketchup_plugin_status_v360.js?v=377'
          new='sketchup_plugin_status_v360.js?v=378'
          assert html.count(old)+html.count(new)==1, "Unexpected script URL"
          if old in html:
              html=html.replace(old,new,1)
              page.write_text(html,encoding="utf-8")
          assert "id='rm-tools-suite'" in html
          assert "const archived=SU_PLUGIN_CATALOG.filter(p=>p.id!=='rm-tools-suite');" in html
          assert '<details id="suplugins-legacy"' in html
          assert re.search(r'<details id="suplugins-legacy"[^>]*>',html).group().find(" open")==-1
          assert html.count("function renderSketchUpPlugins(){")==1
          assert "let suBridgeActiveUrl=null;" in html
          print("PASS: cache-busted corrected SketchUp status script; all catalog entries preserved")

      - name: Test rendering BOTH real JavaScript modules together
        shell: bash
        run: |
          set -euo pipefail
          node --check sketchup_plugin_status_v360.js
          node SketchUpPlugins/tests/test_legacy_renderer_fixed_v2047.js

      - name: Publish corrected live Toolbox
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix only RM TOOLS main card and fold all other plugins under Legacy"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push
