name: Build Texture Library RBZ

on:
  push:
    paths:
      - '.github/workflows/build-texture-library.yml'
      - 'SketchUpPlugins/TextureLibrarySource/twentytwenty_texture_library.rb'
      - 'SketchUpPlugins/TextureLibrarySource/twentytwenty_texture_library/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Validate Ruby syntax
        run: |
          ruby -c SketchUpPlugins/TextureLibrarySource/twentytwenty_texture_library.rb
          ruby -c SketchUpPlugins/TextureLibrarySource/twentytwenty_texture_library/main.rb
      - name: Build RBZ
        run: |
          cd SketchUpPlugins/TextureLibrarySource
          rm -f ../20-20_Texture_Library_v0.1.2.rbz
          zip -r ../20-20_Texture_Library_v0.1.2.rbz twentytwenty_texture_library.rb twentytwenty_texture_library
      - name: Commit RBZ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SketchUpPlugins/20-20_Texture_Library_v0.1.2.rbz
          if git diff --cached --quiet; then
            echo "RBZ unchanged"
          else
            git commit -m "Build Texture Library v0.1.2"
            git push
          fi
