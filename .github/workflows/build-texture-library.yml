name: Build Texture Library RBZ

on:
  push:
    paths:
      - '.github/workflows/build-texture-library.yml'
      - 'SketchUpPlugins/TextureLibrarySource/twentytwenty_texture_library.rb'
      - 'SketchUpPlugins/TextureLibrarySource/twentytwenty_texture_library/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Validate Ruby syntax
        run: |
          ruby -c SketchUpPlugins/TextureLibrarySource/twentytwenty_texture_library.rb
          ruby -c SketchUpPlugins/TextureLibrarySource/twentytwenty_texture_library/main.rb
      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VER="$(grep -oE "EXTENSION\.version[[:space:]]*=[[:space:]]*'[0-9.]+'" SketchUpPlugins/TextureLibrarySource/twentytwenty_texture_library.rb | grep -oE '[0-9.]+' | head -n1)"
          test -n "$VER"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Building Texture Library v$VER"
      - name: Build RBZ
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          cd SketchUpPlugins/TextureLibrarySource
          rm -f "../20-20_Texture_Library_v${VER}.rbz"
          zip -r "../20-20_Texture_Library_v${VER}.rbz" twentytwenty_texture_library.rb twentytwenty_texture_library
      - name: Commit RBZ
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILE="SketchUpPlugins/20-20_Texture_Library_v${VER}.rbz"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "RBZ unchanged"
            exit 0
          fi
          git commit -m "Build Texture Library v${VER}"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push raced with another commit; rebasing (attempt $attempt)..."
            git pull --rebase origin main
          done
          git push
