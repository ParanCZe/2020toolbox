name: PDF validator and PDF/A smoke tests

on:
  pull_request:
    paths:
      - 'AuthorizationBridge/**'
      - 'pdf_validator_tool_v1.js'
      - 'index.html'
      - '.github/workflows/pdf-validator-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validator dependencies
        run: |
          python -m pip install -r AuthorizationBridge/requirements.txt 'pypdf>=5,<7'
      - name: Check Python syntax
        run: python -m py_compile AuthorizationBridge/authorization_bridge.py AuthorizationBridge/pdf_validator_engine.py AuthorizationBridge/eu_dss_validator.py AuthorizationBridge/pdf_signature_inspector.py
      - name: Test PDF/CMS evidence with genuine signed documents
        run: python -m unittest discover -s AuthorizationBridge -p 'test_pdf_signature_inspector.py' -v
      - name: EU DSS structured report and QTSA tests
        run: python AuthorizationBridge/eu_dss_validator.py --self-test
      - name: veraPDF parse and encoding tests
        run: python AuthorizationBridge/pdf_validator_engine.py --self-test
      - name: Check JavaScript syntax
        run: node --check pdf_validator_tool_v1.js
      - name: Ensure independent validation and original signing invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('AuthorizationBridge/authorization_bridge.py').read_text('utf-8')
          assert 'hex_reservation = 65532' in source
          assert 'bytes_reserved=hex_reservation' in source
          assert 'bytes_reserved=262144' not in source
          assert 'def validate_pdf_endpoint()' in source
          assert 'def install_eu_dss_endpoint()' in source
          engine = Path('AuthorizationBridge/pdf_validator_engine.py').read_text('utf-8')
          assert 'from eu_dss_validator import check' in engine
          assert 'adesverify' not in engine
          print('Read-only DSS integration and PDF/A signing invariants passed')
          PY
  windows-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows DSS installer without executing
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'AuthorizationBridge/INSTALL_EU_DSS.ps1'),
            [ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'Windows installer PowerShell syntax OK'
