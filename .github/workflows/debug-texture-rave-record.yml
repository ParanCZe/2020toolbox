name: Debug Texture Rave Record

on:
  push:
    paths:
      - '.github/workflows/debug-texture-rave-record.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Rave records and inspect URLs
        run: |
          echo "=== GREP RAVE ==="
          grep -Rni --include='*.json' --include='*.rb' "rave" SketchUpPlugins/TextureLibrarySource || true
          echo "=== RAKO ==="
          grep -Rni --include='*.json' "Rako" SketchUpPlugins/TextureLibrarySource/twentytwenty_texture_library | head -100 || true
