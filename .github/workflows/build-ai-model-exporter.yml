name: Build AI Model Exporter RBZ

on:
  push:
    paths:
      - '.github/workflows/build-ai-model-exporter.yml'
      - 'SketchUpPlugins/AIModelExporterSource/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Validate Ruby syntax
        run: |
          ruby -c SketchUpPlugins/AIModelExporterSource/twentytwenty_ai_model_exporter.rb
          ruby -c SketchUpPlugins/AIModelExporterSource/twentytwenty_ai_model_exporter/main.rb
      - name: Build RBZ
        run: |
          cd SketchUpPlugins/AIModelExporterSource
          rm -f ../20-20_AI_Model_Exporter_v0.1.0.rbz
          zip -r ../20-20_AI_Model_Exporter_v0.1.0.rbz             twentytwenty_ai_model_exporter.rb             twentytwenty_ai_model_exporter
      - name: Commit RBZ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SketchUpPlugins/20-20_AI_Model_Exporter_v0.1.0.rbz
          if git diff --cached --quiet; then
            echo "RBZ unchanged"
            exit 0
          fi
          git commit -m "Build AI Model Exporter v0.1.0"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push
