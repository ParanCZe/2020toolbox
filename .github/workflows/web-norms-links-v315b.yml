name: Web V3.15b Norm Links

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/web-norms-links-v315b.yml
      - tools/patch_norms_links_v315b.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deep-link norms and refresh changelog
        run: |
          python tools/patch_norms_links_v315b.py
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          e=Path('norms_engine_v314y.js').read_text(encoding='utf-8')
          assert 'V3.15b' in s
          assert "const VERSION='V3.15b'" in s
          assert 'norms_engine_v314y.js?v=315b' in s
          assert 'Otevřít zdroj ↗' not in e
          assert 'Otevřít přesné místo ve zdroji' in e
          assert "p[2]?'-'+p[2]" in e
          print('V3.15b checks OK')
          PY
      - name: Commit V3.15b
        run: |
          git config user.name '20-20 Web Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html norms_engine_v314y.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V3.15b exact norm deep links and whats new'
          git push origin main
