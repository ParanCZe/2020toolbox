name: Presentation Editor V3.32

on:
  push:
    branches: [main]
    paths:
      - presentation_editor_v332.js
      - tools/patch_presentation_editor_v332.py
      - .github/workflows/presentation-editor-v332.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch presentation editor
        run: python tools/patch_presentation_editor_v332.py
      - name: Verify
        run: |
          grep -q 'presentation_editor_v332.js?v=332' index.html
          grep -q 'window.__thumbRenderToken' index.html
          grep -q 'getInfoBarNorthAngle(pageNumber)' index.html
      - name: Commit generated index
        run: |
          git config user.name '20-20 Presentation Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V3.32 per-page north, stable thumbnails and fullscreen editor'
          git push origin main
