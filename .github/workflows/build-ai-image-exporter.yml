name: Build AI Image Exporter RBZ

on:
  push:
    paths:
      - '.github/workflows/build-ai-image-exporter.yml'
      - 'SketchUpPlugins/AIImageExporterSource/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Validate Ruby syntax
        run: |
          ruby -c SketchUpPlugins/AIImageExporterSource/twentytwenty_nano_banana_exporter.rb
          ruby -c SketchUpPlugins/AIImageExporterSource/twentytwenty_nano_banana_exporter/main_v030.rb
      - name: Build RBZ
        run: |
          cd SketchUpPlugins/AIImageExporterSource
          rm -f ../20-20_AI_Image_Exporter_v0.3.0.rbz
          zip -r ../20-20_AI_Image_Exporter_v0.3.0.rbz             twentytwenty_nano_banana_exporter.rb             twentytwenty_nano_banana_exporter
      - name: Commit RBZ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SketchUpPlugins/20-20_AI_Image_Exporter_v0.3.0.rbz
          if git diff --cached --quiet; then
            echo "RBZ unchanged"
            exit 0
          fi
          git commit -m "Build AI Image Exporter v0.3.0"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push
