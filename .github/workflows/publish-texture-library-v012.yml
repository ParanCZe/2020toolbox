name: Publish Texture Library v0.1.3

on:
  push:
    paths:
      - '.github/workflows/publish-texture-library-v012.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Toolbox plugin catalog
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          needle = "id:'texture-library'"
          pos = text.index(needle)
          start = text.rfind("  {", 0, pos)
          if start < 0:
              raise SystemExit("Texture Library object start not found")
          marker = "\n  }\n];"
          marker_pos = text.index(marker, pos)
          end = marker_pos + len("\n  }")
          new = """  {
              id:'texture-library',
              loader:'twentytwenty_texture_library.rb',
              name:'20-20 Texture Library',
              current:'0.1.3',
              description:'Rychlé mapování materiálů klikáním na plochy. Vlastní textury, betonové obklady SIKO, RAL a NCS knihovna.',
              meta:'Betonové obklady: 214 produktů SIKO se správnými názvy, produktovými obrázky a rozměry. V0.1.3 navíc opravuje černé vlastní textury a řadí vlastní/SIKO materiály přehledně pod sebe.',
              icon:'texture',
              versions:[{"version":"0.1.0","file":"20-20_Texture_Library_v0.1.0.rbz","size":10355},{"version":"0.1.1","file":"20-20_Texture_Library_v0.1.1.rbz","size":10779,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.1.rbz"},{"version":"0.1.2","file":"20-20_Texture_Library_v0.1.2.rbz","size":40150,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.2.rbz"},{"version":"0.1.3","file":"20-20_Texture_Library_v0.1.3.rbz","size":40753,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.3.rbz"}]
            }"""
          text = text[:start] + new + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit Toolbox catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Catalog already current"
          else
            git commit -m "Publish Texture Library v0.1.3"
            git push
          fi
