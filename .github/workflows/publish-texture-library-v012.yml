name: Publish Texture Library v0.2.2

on:
  push:
    paths:
      - '.github/workflows/publish-texture-library-v012.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Toolbox plugin catalog
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          needle = "id:'texture-library'"
          pos = text.index(needle)
          start = text.rfind("\n  {", 0, pos)
          start = start + 1 if start >= 0 else text.rfind("{", 0, pos)
          if start < 0:
              raise SystemExit("Texture Library object start not found")

          depth = 0
          quote = None
          escape = False
          end = None
          for i in range(start, len(text)):
              ch = text[i]
              if quote:
                  if escape:
                      escape = False
                  elif ch == "\\":
                      escape = True
                  elif ch == quote:
                      quote = None
                  continue
              if ch in ("'", '"', "`"):
                  quote = ch
                  continue
              if ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit("Texture Library object end not found")
          new = """  {
              id:'texture-library',
              loader:'twentytwenty_texture_library.rb',
              name:'20-20 Texture Library',
              current:'0.2.2',
              description:'Rychlé mapování materiálů. SIKO, EGGER, Poly Haven CC0, official RAKO Rave archive textures, per-face posun/rotace, RAL a NCS.',
              meta:'V0.2.2 opravuje RAKO Rave znovu: předchozí RAKO web zoom měl jen 990×990 px. Teď plugin při prvním Rave stáhne oficiální RAKO balík série a použije originální 1200×1200 JPG variantu (_1), která je méně komprimovaná. Starý HQ cache se nepoužívá.',
              icon:'texture',
              versions:[{"version":"0.1.0","file":"20-20_Texture_Library_v0.1.0.rbz","size":10355},{"version":"0.1.1","file":"20-20_Texture_Library_v0.1.1.rbz","size":10779,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.1.rbz"},{"version":"0.1.2","file":"20-20_Texture_Library_v0.1.2.rbz","size":40150,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.2.rbz"},{"version":"0.1.3","file":"20-20_Texture_Library_v0.1.3.rbz","size":645514,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.3.rbz"},{"version":"0.1.4","file":"20-20_Texture_Library_v0.1.4.rbz","size":645515,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.4.rbz"},{"version":"0.1.5","file":"20-20_Texture_Library_v0.1.5.rbz","size":688143,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.5.rbz"},{"version":"0.1.6","file":"20-20_Texture_Library_v0.1.6.rbz","size":688148,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.6.rbz"},{"version":"0.1.7","file":"20-20_Texture_Library_v0.1.7.rbz","size":650492,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.7.rbz"},{"version":"0.1.8","file":"20-20_Texture_Library_v0.1.8.rbz","size":651778,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.8.rbz"},{"version":"0.1.9","file":"20-20_Texture_Library_v0.1.9.rbz","size":652772,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.9.rbz"},{"version":"0.2.0","file":"20-20_Texture_Library_v0.2.0.rbz","size":652602,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.2.0.rbz"},{"version":"0.2.1","file":"20-20_Texture_Library_v0.2.1.rbz","size":653175,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.2.1.rbz"},{"version":"0.2.2","file":"20-20_Texture_Library_v0.2.2.rbz","size":653587,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.2.2.rbz"}]
            }"""
          text = text[:start] + new + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit Toolbox catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Catalog already current"
          else
            git commit -m "Publish Texture Library v0.2.2"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main
            done
            git push
          fi
