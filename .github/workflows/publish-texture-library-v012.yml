name: Publish Texture Library v0.1.5

on:
  push:
    paths:
      - '.github/workflows/publish-texture-library-v012.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Toolbox plugin catalog
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          needle = "id:'texture-library'"
          pos = text.index(needle)
          start = text.rfind("  {", 0, pos)
          if start < 0:
              raise SystemExit("Texture Library object start not found")
          marker = "\n  }\n];"
          marker_pos = text.index(marker, pos)
          end = marker_pos + len("\n  }")
          new = """  {
              id:'texture-library',
              loader:'twentytwenty_texture_library.rb',
              name:'20-20 Texture Library',
              current:'0.1.5',
              description:'Rychlé mapování materiálů klikáním na plochy. Vlastní textury, společná SIKO knihovna Obklady s filtry, RAL a NCS.',
              meta:'V0.1.5 slučuje betonové obklady a dlažby do jedné záložky Obklady. Přidává filtry Rozměr, Značka, Výrobek a Barva; barva se určuje z názvu a u nejasných položek z produktového obrázku. SIKO textura se při nesouhlasícím poměru stran už násilně neprotahuje.',
              icon:'texture',
              versions:[{"version":"0.1.0","file":"20-20_Texture_Library_v0.1.0.rbz","size":10355},{"version":"0.1.1","file":"20-20_Texture_Library_v0.1.1.rbz","size":10779,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.1.rbz"},{"version":"0.1.2","file":"20-20_Texture_Library_v0.1.2.rbz","size":40150,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.2.rbz"},{"version":"0.1.3","file":"20-20_Texture_Library_v0.1.3.rbz","size":645514,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.3.rbz"},{"version":"0.1.4","file":"20-20_Texture_Library_v0.1.4.rbz","size":645515,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.4.rbz"},{"version":"0.1.5","file":"20-20_Texture_Library_v0.1.5.rbz","size":685180,"repo_file":"SketchUpPlugins/20-20_Texture_Library_v0.1.5.rbz"}]
            }"""
          text = text[:start] + new + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit Toolbox catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Catalog already current"
          else
            git commit -m "Publish Texture Library v0.1.5"
            git push
          fi
