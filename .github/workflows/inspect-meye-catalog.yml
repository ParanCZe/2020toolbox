name: Inspect Meye public catalogue API
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-meye-catalog.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read public Meye markup and accessible metadata endpoints
        run: |
          pip -q install requests beautifulsoup4
          python - <<'PY'
          import requests,re,json,html
          from bs4 import BeautifulSoup
          S=requests.Session()
          S.headers['User-Agent']='20-20-architecti SketchUp integration review (metadata only, contact: info@meye.dk)'
          for url in ['https://meye.dk/','https://meye.dk/wp-json/','https://meye.dk/wp-json/wp/v2/types','https://meye.dk/robots.txt']:
              try:
                  response=S.get(url,timeout=15)
                  print('URL:',url,'STATUS',response.status_code,'TYPE',response.headers.get('Content-Type'),'LEN',len(response.content),'FINAL',response.url)
                  if url.endswith('/'):
                      soup=BeautifulSoup(response.text,'html.parser')
                      print('META GENERATOR:',[x.get('content') for x in soup.select('meta[name=generator]')])
                      print('SCRIPTS:',[x.get('src') for x in soup.select('script[src]')][-25:])
                      print('FORMS:',[(x.get('action'),x.get('id'),x.get('class')) for x in soup.select('form')][:12])
                      print('HTML FEATURES:',[(name,len(soup.select(sel))) for name,sel in [('article','article'),('img','img'),('downloads','a[download]'),('data-image','[data-image]'),('elements','[data-id]')]])
                      print('DOWNLOAD LINKS:',[(x.get('href'),x.get_text(' ',strip=True)[:45]) for x in soup.select('a[href]') if any(k in (x.get('href') or '').lower() for k in ('.png','.zip','download','trees'))][:30])
                      print('PAGE TEXT END:',soup.get_text(' ',strip=True)[-550:])
                      for piece in ['ajaxurl','wp-json','data-src','download','filter']:
                        hit=re.search(piece,response.text,re.I)
                        if hit:print('MATCH',piece,html.unescape(response.text[max(0,hit.start()-200):hit.start()+300]).replace('\\n',' ')[:470])
                  elif 'json' in response.headers.get('Content-Type',''):
                      print('JSON SAMPLE:',response.text[:1050])
                  else:print('TEXT SAMPLE:',response.text[:320])
              except Exception as e:print('ERROR',url,type(e).__name__,str(e)[:220])
          PY
      - name: Discover public tree structure and per-item official downloads
        run: |
          pip -q install requests beautifulsoup4
          python - <<'PY'
          import requests,re,urllib.parse
          from bs4 import BeautifulSoup
          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 (compatible; 20-20 RM TOOLS metadata inspection)'})
          base='https://meye.dk'
          homepage=S.get(base,timeout=12).text
          soup=BeautifulSoup(homepage,'html.parser')
          for n in soup.select('[class*=alm], [data-post-type], [data-repeater]')[:15]:
              print('TREE CONTAINER:',str(n)[:2200])
          for term in ['ajax-load-more','alm-reveal','data-post-type','load-more','tree_list','tree-item','download','2d-cutout']:
              m=re.search(term,homepage,re.I)
              if m:print('HTML FEATURE',term,homepage[max(0,m.start()-200):m.start()+600].replace('\\n',' ')[:790])
          types=S.get(base+'/wp-json/wp/v2/types',timeout=12).json()
          print('PUBLIC WP TYPES:',[(k,v.get('rest_base')) for k,v in types.items()])
          tax=S.get(base+'/wp-json/wp/v2/taxonomies',timeout=12).json()
          print('PUBLIC TAXONOMIES:',[(k,v.get('rest_base'),v.get('types')) for k,v in tax.items()])
          for posttype,data in types.items():
              if posttype in ('attachment','wp_block','wp_template','wp_template_part','wp_navigation'):continue
              u=base+'/wp-json/wp/v2/'+str(data.get('rest_base',posttype))+'?per_page=2'
              try:
                  r=S.get(u,timeout=8)
                  if r.status_code==200 and isinstance(r.json(),list):
                      print('WP EXAMPLES',u,'COUNT',r.headers.get('x-wp-total'),'DATA',[
                          {x:y.get(x) for x in ('id','slug','link','title','acf','meta') if x in y}
                          for y in r.json()][:2])
              except Exception as e:print('WP ERROR',str(e)[:90])
          js=S.get(base+'/wp-content/themes/Divi-child/js/meye.js?v=1.7',timeout=12).text
          print('SITE JS LEN:',len(js))
          print('SITE JS TOP:',js[:3800])
          for x in ['download','full','image','png','ajax','tree','season','species','href']:
              m=re.search(x,js,re.I)
              if m:print('SITE JS TERM:',x,js[max(0,m.start()-140):m.start()+350].replace('\\n',' ')[:500])
          PY

      - name: Examine two real tree records, their official PNG links and previews
        run: |
          pip -q install requests beautifulsoup4
          python - <<'PY'
          import requests,re,json
          from bs4 import BeautifulSoup
          S=requests.Session()
          S.headers['User-Agent']='20-20 RM TOOLS metadata inspection Mozilla/5.0'
          for id in [8647,7933]:
              u=f'https://meye.dk/wp-json/wp/v2/project/{id}?_embed=1'
              r=S.get(u,timeout=16)
              print('PROJECT REST',id,r.status_code,len(r.content))
              if r.status_code!=200:continue
              p=r.json()
              print('PROJECT FIELDS:',[(k,str(v)[:190]) for k,v in p.items() if k in ('id','slug','link','title','featured_media','content','project_category','project_tag','meta','_embedded')])
              media=(p.get('_embedded') or {}).get('wp:featuredmedia') or []
              print('FEATURED MEDIA:',[(m.get('source_url'),m.get('media_details',{}).get('sizes')) for m in media][:1])
              soup=BeautifulSoup(S.get(p['link'],timeout=16).text,'html.parser')
              for sel in ['article.project a[href]','.et_pb_lightbox_image','a[href*=".png"]','a[href*=".zip"]','img[data-src]']:
                  elements=soup.select(sel)
                  print('PAGE SELECTOR',id,sel,len(elements),[
                      {'href':x.get('href'),'src':x.get('src'),'data-src':x.get('data-src'),'text':x.get_text(' ',strip=True)[:40]}
                      for x in elements[:4]
                  ])
              for el in soup.select('article.project')[:2]:print('PAGE ARTICLE HTML',str(el)[:3600])
              print('TAXONOMY:',p.get('project_category'),p.get('project_tag'))
          PY
