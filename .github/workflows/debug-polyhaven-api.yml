name: Debug Poly Haven API

on:
  push:
    paths:
      - '.github/workflows/debug-polyhaven-api.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect API
        run: |
          python - <<'PY'
          import json, urllib.request
          H={'User-Agent':'20-20 Texture Library/0.2 test'}
          for url in [
            'https://api.polyhaven.com/assets?type=textures',
            'https://api.polyhaven.com/assets?type=1',
            'https://api.polyhaven.com/files/concrete_floor_01',
          ]:
            print('\nURL',url)
            req=urllib.request.Request(url,headers=H)
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                data=json.load(r)
              if isinstance(data,dict):
                print('TYPE dict LEN',len(data))
                print(json.dumps(dict(list(data.items())[:2]),indent=2)[:25000])
              else:
                print(type(data),json.dumps(data)[:25000])
            except Exception as e:
              print('ERROR',repr(e))
          PY
