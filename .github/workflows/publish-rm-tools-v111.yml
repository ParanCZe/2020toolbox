name: Publish RM Tools v1.1.1
on:
  push:
    branches: [main]
    paths:
      - 'SketchUpPlugins/20-20_RM_Tools_v1.1.1.rbz'
permissions:
  contents: write
jobs:
  patch-toolbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update RM Tools registry
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          start=s.find("id:'rm-checker'")
          if start < 0: raise SystemExit("rm-checker block not found")
          block_start=s.rfind("{",0,start)
          depth=0; quote=None; esc=False; block_end=None
          for i in range(block_start,len(s)):
              c=s[i]
              if quote:
                  if esc: esc=False
                  elif c=="\\": esc=True
                  elif c==quote: quote=None
                  continue
              if c in "'\"\`": quote=c; continue
              if c=="{": depth+=1
              elif c=="}":
                  depth-=1
                  if depth==0: block_end=i+1; break
          b=s[block_start:block_end]
          b=re.sub(r"current:'[^']*'","current:'1.1.1'",b,count=1)
          b=re.sub(r"meta:'[^']*'","meta:'V1.1.1 opravuje načítání pluginu a toolbaru ve SketchUpu 2026 po aktualizaci ze staršího RM Checkeru. Loader nyní explicitně načte hlavní modul, drží command/toolbar reference a při chybě zobrazí diagnostiku místo tichého selhání. Funkce v1.1.0 zůstávají zachované.'",b,count=1)
          if '"version":"1.1.1"' not in b:
              pos=b.rfind("]")
              pre=b[:pos].rstrip()
              if not pre.endswith(","): pre += ","
              entry='\n    {"version":"1.1.1","file":"20-20_RM_Tools_v1.1.1.rbz","size":13485,"repo_file":"SketchUpPlugins/20-20_RM_Tools_v1.1.1.rbz"}\n  '
              b=pre+entry+b[pos:]
          p.write_text(s[:block_start]+b+s[block_end:],encoding="utf-8")
      - name: Commit toolbox registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix RM Tools loader v1.1.1"
          git push
